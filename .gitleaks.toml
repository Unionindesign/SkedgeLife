# Secret scanning rules for CI and the pre-commit hook: gitleaks' defaults,
# plus an allowlist for values that look like secrets but aren't.
[extend]
useDefault = true

[[allowlists]]
description = "Supabase's fixed local development key: the same on every machine, and it only works against a local instance (apps/mobile/.env.example)"
regexes = ['''sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH''']
