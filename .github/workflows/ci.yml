# Runs on every PR and on pushes to main. See docs/dev/testing.md.
#
# Hardening: third-party actions are pinned to full commit SHAs (Dependabot
# bumps them, see .github/dependabot.yml), the token is read-only and isn't
# left in .git/config for dependency install scripts to find, and every job
# has a timeout.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its run in progress. Runs on main always
# finish, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, format, unit tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The website's production build. It renders nothing ahead of time, so
      # the local Supabase values below are never contacted.
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Just the Supabase CLI, at the version in package-lock.json; no need to
      # install the whole monorepo for this job.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # A throwaway local Postgres with every migration and the seed applied;
      # CI never talks to the hosted project.
      - run: supabase db start
      - run: supabase test db

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, so a secret added and removed within a PR is still caught
      # gitleaks' own image, pinned by digest; the GitHub Action needs a paid
      # license for organization repos. Rules and allowlist: .gitleaks.toml.
      - run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
